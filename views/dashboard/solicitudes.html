<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes de adopción — Adoptify</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="dashboard-body">

<!-- TOPBAR MÓVIL -->
<div class="dash-topbar">
    <div class="dash-topbar-logo">
        <span class="logo-icon">🐾</span>
        <span><span class="accent">Adopt</span>ify</span>
    </div>
    <button class="dash-menu-toggle" id="dashMenuToggle" aria-label="Menú">☰</button>
</div>
<!-- Overlay para cerrar el menú -->
<div class="sidebar-overlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="sidebar-logo">
        <span class="logo-icon">🐾</span>
        <span class="logo-text"><span class="accent">Adopt</span>ify</span>
    </div>
    <nav class="sidebar-nav">
        <a href="/dashboard" class="sidebar-link">
            <span>📊</span> Resumen
        </a>
        <a href="/dashboard/perros" class="sidebar-link">
            <span>🐕</span> Mis perros
        </a>
        <a href="/dashboard/solicitudes" class="sidebar-link active">
            <span>📋</span> Solicitudes
        </a>
        <a href="/dashboard/reportes" class="sidebar-link">
            <span>📍</span> Reportes
        </a>
    </nav>
    <div class="sidebar-footer">
        <a href="/" class="sidebar-link">← Ver sitio</a>
        <button class="sidebar-link btn-logout" id="btnLogout">Cerrar sesión</button>
    </div>
</aside>

<main class="dashboard-main">
    <header class="dash-header">
        <h1>📋 Solicitudes de adopción</h1>
    </header>

    <!-- Filtro por estado -->
    <div class="filters-bar-dash">
        <button class="filter-chip active" data-estado="todas">Todas</button>
        <button class="filter-chip" data-estado="pendiente">Pendientes</button>
        <button class="filter-chip" data-estado="aprobada">Aprobadas</button>
        <button class="filter-chip" data-estado="rechazada">Rechazadas</button>
    </div>

    <div class="solicitudes-list" id="solicitudesList">
        <p class="table-loading">Cargando solicitudes...</p>
    </div>
</main>

<script src="/js/main.js"></script>
<script src="/js/dash-solicitudes.js"></script>
<script src="/js/dashboard-nav.js"></script>
</body>
</html>
