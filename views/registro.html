<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse — Huellas a Casa</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">

<div class="auth-container">
    <a href="/" class="auth-logo">
        <span class="logo-icon">🐾</span>
        <span class="logo-text">Huellas <span class="accent">a Casa</span></span>
    </a>

    <div class="auth-card">
        <h1>Crear cuenta</h1>
        <p class="auth-subtitle">Únete a la comunidad de Huellas a Casa.</p>

        <!-- Selector de tipo de cuenta -->
        <div class="role-tabs">
            <button class="role-tab active" data-rol="ciudadano" type="button">
                👤 Soy ciudadano
            </button>
            <button class="role-tab" data-rol="org" type="button">
                🏠 Soy organización
            </button>
        </div>

        <form id="formRegistro">
            <input type="hidden" id="rolInput" name="rol" value="ciudadano">

            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre"
                       placeholder="Tu nombre completo" required>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email"
                       placeholder="tu@correo.com" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono (opcional)</label>
                <input type="tel" id="telefono" name="telefono"
                       placeholder="844 000 0000">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password"
                       placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>

            <!-- Campos solo para organizaciones -->
            <div id="orgFields" class="hidden">
                <hr class="divider">
                <p class="form-section-title">Datos de la organización</p>
                <div class="form-group">
                    <label for="nombre_org">Nombre de la organización <span class="required">*</span></label>
                    <input type="text" id="nombre_org" name="nombre_org"
                           placeholder="Ej. Rescate San Pedro AC">
                </div>
                <div class="form-group">
                    <label for="direccion_org">Dirección</label>
                    <input type="text" id="direccion_org" name="direccion_org"
                           placeholder="Calle, colonia, ciudad">
                </div>
                <div class="form-group">
                    <label for="descripcion_org">Descripción breve</label>
                    <textarea id="descripcion_org" name="descripcion_org" rows="3"
                        placeholder="¿Qué hace tu organización?"></textarea>
                </div>
            </div>

            <div id="registroMsg" class="form-msg hidden"></div>

            <button type="submit" class="btn btn-primary btn-full">Crear cuenta</button>
        </form>

        <p class="auth-footer">
            ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
        </p>
    </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/registro.js"></script>
</body>
</html>
