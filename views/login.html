<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Huellas a Casa</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">

<div class="auth-container">
    <a href="/" class="auth-logo">
        <span class="logo-icon">🐾</span>
        <span class="logo-text">Huellas <span class="accent">a Casa</span></span>
    </a>

    <div class="auth-card">
        <h1>Iniciar sesión</h1>
        <p class="auth-subtitle">Accede a tu cuenta para adoptar o gestionar reportes.</p>

        <form id="formLogin">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email"
                       placeholder="tu@correo.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password"
                       placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div id="loginMsg" class="form-msg hidden"></div>

            <button type="submit" class="btn btn-primary btn-full">Iniciar sesión</button>
        </form>

        <p class="auth-footer">
            ¿No tienes cuenta? <a href="/registro">Regístrate aquí</a>
        </p>

        <!-- Cuentas de prueba -->
        <div class="test-accounts">
            <p class="test-title">Cuentas de prueba</p>
            <div class="test-row">
                <span>Organización:</span>
                <code>rescate@sanpedro.com</code>
            </div>
            <div class="test-row">
                <span>Ciudadano:</span>
                <code>ana@email.com</code>
            </div>
            <div class="test-row">
                <span>Contraseña:</span>
                <code>password</code>
            </div>
        </div>
    </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
